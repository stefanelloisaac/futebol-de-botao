<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d6b47"/>
      <stop offset="100%" stop-color="#2c5236"/>
    </linearGradient>
  </defs>
  <!-- Background felt -->
  <rect width="100" height="100" rx="16" fill="url(#g)"/>
  <!-- Football (pentagon pattern) -->
  <circle cx="50" cy="50" r="22" fill="#f2e7cf" stroke="#2a231b" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="18" fill="#b23a34" opacity="0.9"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#d9a441" stroke-width="2.5" opacity="0.7"/>
  <!-- Goal frame -->
  <rect x="30" y="10" width="40" height="12" rx="2" fill="none" stroke="#d9a441" stroke-width="2.5"/>
  <!-- Button player -->
  <circle cx="50" cy="52" r="11" fill="#2f4b73" stroke="#f2e7cf" stroke-width="1"/>
  <text x="50" y="56" text-anchor="middle" fill="#f2e7cf" font-size="12" font-family="sans-serif" font-weight="bold">F</text>
  <!-- Ball -->
  <circle cx="50" cy="35" r="4" fill="#f2e7cf" stroke="#2a231b" stroke-width="0.8"/>
</svg>
